{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agri-help-app.fullname" . }}-secrets
  labels:
    {{- include "agri-help-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  
  # Database connection string
  database-url: {{ printf "postgresql://%s:%s@%s:%s/%s" (.Values.postgresql.global.postgresql.auth.username | default "postgres") (.Values.postgresql.global.postgresql.auth.password | default "postgres") (printf "%s-postgresql" .Release.Name) "5432" (.Values.postgresql.global.postgresql.auth.database | default "postgres") | b64enc | quote }}
  
  # Redis URL (if using auth)
  redis-url: {{ printf "redis://%s:%s@%s:6379/0" (default "default" .Values.redis.auth.username) (.Values.redis.auth.password | default "redis") (printf "%s-redis-master" .Release.Name) | b64enc | quote }}
{{- end }}
