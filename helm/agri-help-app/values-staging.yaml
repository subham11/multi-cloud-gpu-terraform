# ============================================================================
# AgriBot Ethiopia - Staging Environment Values
# Balanced configuration for staging with production-like setup
# ============================================================================

global:
  environment: staging
  domain: agri-help-staging.local

# ============================================================================
# Backend Service
# ============================================================================
backend:
  replicaCount: 2
  
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: api-staging.agri-help.com
        paths:
          - path: /
            pathType: Prefix
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      nvidia.com/gpu: "0"
    limits:
      cpu: 1000m
      memory: 2Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
  
  env:
    - name: ENVIRONMENT
      value: staging
    - name: LOG_LEVEL
      value: info

# ============================================================================
# Frontend Service
# ============================================================================
frontend:
  replicaCount: 2
  
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: staging.agri-help.com
        paths:
          - path: /
            pathType: Prefix
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3

# ============================================================================
# OAN UI Service
# ============================================================================
oanUI:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# ============================================================================
# Transcribe Service
# ============================================================================
transcribeService:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: 500m
      memory: 1Gi

# ============================================================================
# PostgreSQL Configuration
# ============================================================================
postgresql:
  enabled: true
  
  primary:
    persistence:
      enabled: true
      size: 20Gi
    
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ============================================================================
# Redis Configuration
# ============================================================================
redis:
  enabled: true
  
  master:
    persistence:
      enabled: true
      size: 10Gi
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
  
  replica:
    replicaCount: 1

# ============================================================================
# Qdrant Vector Database
# ============================================================================
qdrant:
  enabled: true
  
  replicaCount: 1
  
  persistence:
    enabled: true
    size: 25Gi
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ============================================================================
# Pod Disruption Budgets
# ============================================================================
backend:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ============================================================================
# Network Policies
# ============================================================================
networkPolicy:
  enabled: true

# ============================================================================
# Monitoring
# ============================================================================
monitoring:
  enabled: true
  
  serviceMonitor:
    enabled: true

# ============================================================================
# Backup
# ============================================================================
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 7

# ============================================================================
# Features
# ============================================================================
features:
  gpu:
    enabled: false
  tracing:
    enabled: false
