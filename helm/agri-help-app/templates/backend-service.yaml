{{- if .Values.backend.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agri-help-app.fullname" . }}-backend
  labels:
    {{- include "agri-help-app.labels" . | nindent 4 }}
    component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "agri-help-app.selectorLabels" . | nindent 4 }}
    component: backend
{{- end }}
