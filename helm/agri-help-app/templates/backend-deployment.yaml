{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agri-help-app.fullname" . }}-backend
  labels:
    {{- include "agri-help-app.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agri-help-app.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        {{- with .Values.backend.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agri-help-app.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      serviceAccountName: {{ include "agri-help-app.serviceAccountName" . }}
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        {{- with .Values.backend.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        
        {{- with .Values.backend.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
        
        securityContext:
          {{- toYaml .Values.backend.securityContext | nindent 12 }}
        
        env:
        {{- with .Values.backend.env }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "agri-help-app.fullname" . }}-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://:{{ .Values.redis.auth.password }}@{{ .Release.Name }}-redis-master:{{ .Values.redis.port }}/0"
        - name: QDRANT_URL
          value: "http://{{ .Release.Name }}-qdrant:6333"
        
        {{- with .Values.backend.envFrom }}
        envFrom:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        
        volumeMounts:
        {{- with .Values.backend.volumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
