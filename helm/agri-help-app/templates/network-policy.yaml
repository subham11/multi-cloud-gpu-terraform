{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agri-help-app.fullname" . }}-backend
  labels:
    {{- include "agri-help-app.labels" . | nindent 4 }}
    component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "agri-help-app.selectorLabels" . | nindent 6 }}
      component: backend
  
  policyTypes:
  - Ingress
  - Egress
  
  # Allow ingress from load balancer and ingress controller
  ingress:
  {{- with .Values.networkPolicy.ingress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  
  # Allow egress to other services
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  
  {{- with .Values.networkPolicy.egress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  
  # Allow to databases
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    ports:
    - protocol: TCP
      port: 5432
  
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 6379
  
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: qdrant
    ports:
    - protocol: TCP
      port: 6333
{{- end }}
